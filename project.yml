name: ImageResizer
options:
  bundleIdPrefix: com.silverstonelabs
  deploymentTarget:
    macOS: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false

targets:
  ImageResizer:
    type: application
    platform: macOS
    sources:
      - path: ImageResizer
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: "Squishy"
        PRODUCT_MODULE_NAME: "ImageResizer"
        INFOPLIST_FILE: ImageResizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ImageResizer/Entitlements/ImageResizer.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false

  ImageResizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ImageResizerTests
    dependencies:
      - target: ImageResizer
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Squishy.app/Contents/MacOS/Squishy
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
