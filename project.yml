name: ImageResizer
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false

targets:
  ImageResizer:
    type: application
    platform: macOS
    sources:
      - path: ImageResizer
    settings:
      base:
        PRODUCT_NAME: "ImageResizer"
        INFOPLIST_FILE: ImageResizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ImageResizer/Entitlements/ImageResizer.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false

  ImageResizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ImageResizerTests
    dependencies:
      - target: ImageResizer
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
