name: ImageResizer
options:
  bundleIdPrefix: com.silverstonelabs
  deploymentTarget:
    macOS: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ImageResizer:
    type: application
    platform: macOS
    sources:
      - path: ImageResizer
    dependencies:
      - package: Sparkle
        product: Sparkle
    postCompileScripts:
      - name: "Stamp Auto Version to Plist"
        script: |
          build_number=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo "1")
          if [ -f "${SRCROOT}/VERSION" ]; then
            version=$(cat "${SRCROOT}/VERSION" | tr -d '[:space:]')
          else
            version="1.0.0"
          fi
          plist_path="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "${plist_path}" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${build_number}" "${plist_path}" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${build_number}" "${plist_path}" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" "${plist_path}" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${version}" "${plist_path}" 2>/dev/null || true
          fi
    settings:
      base:
        PRODUCT_NAME: "Squishy"
        PRODUCT_MODULE_NAME: "ImageResizer"
        INFOPLIST_FILE: ImageResizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ImageResizer/Entitlements/ImageResizer.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false

  ImageResizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ImageResizerTests
    dependencies:
      - target: ImageResizer
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Squishy.app/Contents/MacOS/Squishy
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
